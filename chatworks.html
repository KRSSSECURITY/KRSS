<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatworks — Private Messaging</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#06111f,#102b45);color:#102033;min-height:100vh}.shell{width:min(1100px,94%);margin:28px auto}.brand{color:#d6aa52;font-weight:900;letter-spacing:1px}.auth,.app{background:#fff;border-radius:18px;box-shadow:0 20px 70px #0006;overflow:hidden}.auth{max-width:430px;margin:7vh auto;padding:28px}.auth h1{margin:8px 0}.hint{color:#64748b;font-size:14px}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1;padding:11px;border:1px solid #dbe3ec;background:#f5f7fa;border-radius:8px;font-weight:800}.tabs button.active{background:#d6aa52;border-color:#d6aa52}.form{display:grid;gap:10px}.form input,.form button,.composer textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #cbd5e1;font:inherit}.form button,.composer button{background:#d6aa52;border:0;font-weight:800;cursor:pointer}.note{font-size:12px;color:#64748b}.err{color:#b42318;background:#fff0ef;padding:9px;border-radius:8px}.app{display:grid;grid-template-columns:310px 1fr;min-height:680px}.side{border-right:1px solid #e5e7eb;background:#f8fafc}.sidehead{padding:18px;border-bottom:1px solid #e5e7eb}.sidehead b{display:block}.search{margin-top:12px;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px}.users{max-height:550px;overflow:auto}.user{padding:13px 16px;border-bottom:1px solid #e5e7eb;cursor:pointer}.user:hover,.user.active{background:#eef4f8}.user small{display:block;color:#64748b;margin-top:3px}.main{display:flex;flex-direction:column}.top{padding:18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}.top button{border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:8px 11px}.messages{flex:1;padding:20px;overflow:auto;background:#fbfcfd}.bubble{max-width:72%;padding:10px 13px;border-radius:13px;margin:8px 0;line-height:1.4}.mine{margin-left:auto;background:#e6f4ea}.theirs{background:#eef2f7}.bubble small{display:block;color:#64748b;font-size:10px;margin-top:4px}.composer{padding:14px;border-top:1px solid #e5e7eb;display:flex;gap:8px}.composer textarea{resize:none;flex:1}.composer button{width:100px;border-radius:9px}.tools{display:flex;gap:7px;flex-wrap:wrap;padding:9px 14px;background:#f8fafc;border-top:1px solid #e5e7eb}.tools button,.tools label{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer}.tools input{display:none}.status{font-size:12px;color:#16803c;display:block;margin-top:4px}.status.off{color:#64748b}.attachment{display:block;max-width:240px;max-height:240px;margin-top:8px;border-radius:8px}.bubble a{color:#174ea6;word-break:break-all}.sysnote{font-size:12px;color:#64748b;text-align:center;margin:10px}.empty{height:100%;display:grid;place-items:center;color:#64748b;text-align:center;padding:30px}@media(max-width:720px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #e5e7eb}.users{max-height:190px}.main{min-height:520px}.composer{position:sticky;bottom:0}.bubble{max-width:88%}}
</style></head><body><div class="shell"><div class="brand">CHATWORKS</div><div id="auth" class="auth"><h1>Private Messaging</h1><p class="hint">Search registered users and chat one-to-one. Your messages are visible only to you and the person you are chatting with.</p><div class="tabs"><button id="loginTab" class="active">Login</button><button id="regTab">Create account</button></div><form id="loginForm" class="form"><input id="loginUser" placeholder="Username" autocomplete="username" required><input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" required><button>Login</button><div id="loginNote" class="note"></div></form><form id="regForm" class="form" style="display:none"><input id="regName" placeholder="Your name" required><input id="regUser" placeholder="Username" required><input id="regPass" type="password" placeholder="Password (8+ characters)" minlength="8" required><button>Create account</button><div id="regNote" class="note"></div></form></div><div id="app" class="app" style="display:none"><aside class="side"><div class="sidehead"><b id="meName"></b><small id="meUser"></small><input id="search" class="search" placeholder="Search users..."></div><div id="userList" class="users"></div></aside><main class="main"><div class="top"><div><b id="chatTitle">Select a user</b><small id="chatUser"></small><span id="presence" class="status off">Offline</span></div><button id="logout">Logout</button></div><div id="messages" class="messages"><div class="empty">Search for a registered user and select them to start a private conversation.<div style="text-align:center;margin:12px 0"><a href="mailto:krss0099j@gmail.com">KRSS Email: krss0099j@gmail.com</a></div></div><form id="composer" class="composer" style="display:none"><textarea id="message" rows="2" placeholder="Write a private message..." maxlength="2000" required></textarea><button>Send</button></form></main></div></div><script>
let me=null,selected=null,timer=null,presenceTimer=null,recorder=null,recordChunks=[];const $=id=>document.getElementById(id);function note(el,msg,err=false){el.textContent=msg;el.className=err?'note err':'note'}
$('loginTab').onclick=()=>{ $('loginTab').classList.add('active');$('regTab').classList.remove('active');$('loginForm').style.display='grid';$('regForm').style.display='none'};$('regTab').onclick=()=>{$('regTab').classList.add('active');$('loginTab').classList.remove('active');$('loginForm').style.display='none';$('regForm').style.display='grid'};
async function check(){try{const r=await fetch('/api/chatworks/me');const d=await r.json();if(d.authenticated){me=d.user;showApp()}}catch{note($('loginNote'),'Please open Chatworks through the KRSS website server.',true)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/chatworks/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({username:$('loginUser').value,password:$('loginPass').value})});const d=await r.json();if(!r.ok)return note($('loginNote'),d.error||'Login failed',true);me=d.user;showApp()};
$('regForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/chatworks/register',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({name:$('regName').value,username:$('regUser').value,password:$('regPass').value})});const d=await r.json();if(!r.ok)return note($('regNote'),d.error||'Registration failed',true);me=d.user;showApp()};
function showApp(){$('auth').style.display='none';$('app').style.display='grid';$('meName').textContent=me.name;$('meUser').textContent='@'+me.username;loadUsers('');heartbeat();presenceTimer=setInterval(heartbeat,15000)}
async function heartbeat(){try{await fetch('/api/chatworks/presence',{method:'POST'})}catch{}}
async function loadUsers(q){const r=await fetch('/api/chatworks/users?q='+encodeURIComponent(q));if(!r.ok)return;const d=await r.json();$('userList').innerHTML=d.users.map(u=>`<div class="user ${selected&&selected.id===u.id?'active':''}" onclick='selectUser(${JSON.stringify(u)})'><b>${esc(u.name)}</b><small>@${esc(u.username)}</small><small class="${u.online?'status':'status off'}">${u.online?'● Online':'○ Offline'}</small></div>`).join('')||'<div class="empty">No users found. Search at least 2 letters.</div>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.selectUser=u=>{selected=u;$('chatTitle').textContent=u.name;$('chatUser').textContent='@'+u.username;$('presence').textContent=u.online?'● Online':'○ Offline';$('presence').className=u.online?'status':'status off';$('composer').style.display='flex';$('tools').style.display='flex';loadUsers($('search').value);loadMessages();clearInterval(timer);timer=setInterval(()=>{loadMessages();loadUsers($('search').value)},3000);$('message').focus()};
function renderAttachment(m){if(!m.attachment)return '';const a=m.attachment;if(!a.data||!String(a.data).startsWith('data:'))return '';if(a.kind==='image')return `<a href="${a.data}" target="_blank" rel="noopener"><img class="attachment" src="${a.data}" alt="Shared image"></a>`;if(a.kind==='audio')return `<audio class="attachment" controls src="${a.data}"></audio>`;return `<a href="${a.data}" download="${esc(a.name||'shared-file')}">📎 ${esc(a.name||'Download file')}</a>`}
async function loadMessages(){if(!selected)return;const r=await fetch('/api/chatworks/messages/'+selected.id);if(!r.ok)return;const d=await r.json();$('messages').innerHTML=d.blockedByThem?'<div class="empty">This user has blocked you. You cannot send messages.</div>':(d.messages.map(m=>`<div class="bubble ${m.from===me.id?'mine':'theirs'}">${esc(m.text||'')}${renderAttachment(m)}<small>${m.from===me.id?'You':esc(selected.name)} · ${new Date(m.time).toLocaleString()}</small></div>`).join('')||'<div class="empty">No messages yet. Say hello 👋</div>');$('messages').scrollTop=$('messages').scrollHeight;if(d.blockedByMe){$('composer').style.display='none';$('tools').style.display='flex';$('toolNote').textContent='You blocked this user. Unblock by selecting Block user again.'}else{$('composer').style.display='flex';$('toolNote').textContent=''} }
async function sendMessage(text,attachment=null){if(!selected)return;const r=await fetch('/api/chatworks/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:selected.id,text,attachment})});const d=await r.json().catch(()=>({}));if(!r.ok){note($('toolNote'),d.error||'Send failed',true);return false}await loadMessages();return true}
$('search').oninput=e=>loadUsers(e.target.value.trim());$('composer').onsubmit=async e=>{e.preventDefault();const text=$('message').value.trim();if(!text)return;if(await sendMessage(text))$('message').value=''};
$('emojiBtn').onclick=()=>{const emojis=['😊','😂','❤️','👍','🙏','🎉','👋','😢','🔥','🚗'];const chosen=prompt('Choose emoji:\n'+emojis.join(' '),'😊');if(chosen){$('message').value+=chosen;$('message').focus()}};
$('attach').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>1.5*1024*1024){note($('toolNote'),'Please choose a file smaller than 1.5 MB.',true);e.target.value='';return}if(!(f.type.startsWith('image/')||f.type==='application/pdf'||f.type==='text/plain'||f.type.includes('word'))){note($('toolNote'),'This file type is not supported.',true);return}const reader=new FileReader();reader.onload=async()=>{const kind=f.type.startsWith('image/')?'image':'file';if(await sendMessage('',{kind,name:f.name,type:f.type,data:reader.result}))note($('toolNote'),'File sent.');};reader.readAsDataURL(f);e.target.value=''};
$('voiceBtn').onclick=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();$('voiceBtn').textContent='🎙️ Voice message';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);recordChunks=[];recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});stream.getTracks().forEach(t=>t.stop());if(blob.size>1.5*1024*1024){note($('toolNote'),'Voice message too large. Please record a shorter message.',true);return}const rd=new FileReader();rd.onload=()=>sendMessage('',{kind:'audio',name:'voice-message.webm',type:blob.type,data:rd.result});rd.readAsDataURL(blob)};recorder.start();$('voiceBtn').textContent='⏹ Stop & send';note($('toolNote'),'Recording… click Stop & send when finished.')}catch{note($('toolNote'),'Microphone permission is needed for voice messages.',true)}};
$('blockBtn').onclick=async()=>{if(!selected)return;const r=await fetch('/api/chatworks/block',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:selected.id})});const d=await r.json();note($('toolNote'),d.blocked?'User blocked.':'User unblocked.');loadMessages()};
$('reportBtn').onclick=async()=>{if(!selected)return;const reason=prompt('Why are you reporting this user?');if(!reason)return;const r=await fetch('/api/chatworks/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:selected.id,reason})});const d=await r.json();note($('toolNote'),r.ok?'Report submitted to site administrators.':(d.error||'Report failed'),!r.ok)};
$('logout').onclick=async()=>{clearInterval(timer);clearInterval(presenceTimer);await fetch('/api/chatworks/logout',{method:'POST'});location.reload()};check();
</script></body></html>
